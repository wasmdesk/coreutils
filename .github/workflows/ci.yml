name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pure-Go CGO=0. Two-stage CI per the wasmdesk family standard:
#   - test gate (3 OSes): vet + build + race-test + 100% statement coverage
#     across the Run + dispatch surface (cmd/<tool>/main wrappers are thin
#     glue and excluded from the gate).
#   - arch matrix (6 Go 64-bit targets): native runners where available,
#     qemu-user for the rest. Build + test under each target to catch
#     endian / word-size regressions.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        env:
          GOWORK: "off"
        run: |
          COVERPKG=$(go list ./... | grep -vE '/main$|/cmd/multicall$' | paste -sd, -)
          PKGS=$(go list ./... | grep -vE '/main$|/cmd/multicall$')
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out $PKGS
          go tool cover -func=cover.out | tail -1
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go env GOARCH
      - name: Vet + build + test
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go build ./...
          go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Vet + test under qemu (${{ matrix.goarch }})
        env:
          GOWORK: "off"
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go vet ./...
          GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
